<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmark Sidebar</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- アイコン一覧（パネル幅に合わせて格子状に折り返す） -->
  <main id="dock">
    <div id="bookmark-grid" role="list"></div>
    <button id="add-btn" type="button" title="ブックマークを追加">＋</button>
  </main>

  <!-- 追加フォーム（開いている間はアイコン一覧の代わりに表示） -->
  <section id="add-panel" hidden>
    <h1>ブックマークを追加</h1>
    <div id="drop-zone">アイコン画像をここにドロップ</div>
    <label id="file-label">ファイルを選択
      <input type="file" id="icon-input" accept="image/png,image/jpeg">
    </label>
    <div id="icon-preview-wrap" hidden>
      <img id="icon-preview" alt="プレビュー">
      <button id="clear-icon-btn" type="button" title="画像をクリア">✕</button>
    </div>
    <input type="url" id="url-input" placeholder="https://example.com">
    <p id="form-message" role="alert"></p>
    <div id="add-panel-footer">
      <button id="cancel-btn" type="button">キャンセル</button>
      <button id="save-btn" type="button">保存</button>
    </div>
  </section>

  <!-- 右クリックメニュー -->
  <div id="context-menu" hidden>
    <button id="delete-btn" type="button">削除</button>
  </div>

  <!-- 削除の確認（alert / confirm は使わずパネル内で確認する） -->
  <dialog id="confirm-dialog">
    <p id="confirm-text"></p>
    <form method="dialog">
      <button value="cancel">キャンセル</button>
      <button value="ok" id="confirm-ok">削除</button>
    </form>
  </dialog>

  <p id="status" role="status"></p>

  <script src="utils.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
